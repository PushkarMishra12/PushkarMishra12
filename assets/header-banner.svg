<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="850" height="240" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="120" cy="50" r="130" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="750" cy="190" r="140" fill="#818cf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="450" cy="120" r="90" fill="#c084fc" opacity="0.08" filter="url(#glow)" />

  <!-- Subtle Border with Gradient -->
  <rect x="1" y="1" width="848" height="238" rx="15" fill="none" stroke="url(#textGrad)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Header Badge -->
  <g transform="translate(60, 42)">
    <rect width="180" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5" />
    <circle cx="14" cy="13" r="4" fill="#38bdf8" />
    <text x="26" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ENGINEERING PORTFOLIO</text>
  </g>

  <!-- Name Title -->
  <text x="60" y="112" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    PUSHKAR MISHRA
  </text>

  <!-- Role Subtitle -->
  <text x="60" y="148" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
    Full-Stack Web Architect &amp; High-Performance API Engineer
  </text>

  <!-- Highlights / Focus Tags -->
  <g transform="translate(60, 175)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
    <text x="12" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">⚡ FastAPI &amp; Microservices</text>

    <!-- Tag 2 -->
    <rect x="145" y="0" width="150" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
    <text x="157" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">🌐 Modern Full-Stack Web</text>

    <!-- Tag 3 -->
    <rect x="305" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
    <text x="317" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">🛰️ Applied AI &amp; Vision</text>

    <!-- Tag 4 -->
    <rect x="460" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
    <text x="472" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">📡 Autonomous Telemetry</text>
  </g>

  <!-- Right Decorative Tech Icons Graphic -->
  <g transform="translate(690, 45)">
    <circle cx="50" cy="50" r="45" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="50" cy="50" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <!-- Code Brackets Icon -->
    <path d="M 44 42 L 36 50 L 44 58 M 56 42 L 64 50 L 56 58" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="10" cy="18" r="3" fill="#818cf8" />
    <circle cx="85" cy="25" r="2.5" fill="#c084fc" />
    <circle cx="80" cy="85" r="3" fill="#38bdf8" />
  </g>
</svg>
