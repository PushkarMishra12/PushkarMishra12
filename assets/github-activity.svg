<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="180" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3572A5" />
      <stop offset="55%" stop-color="#3572A5" />
      <stop offset="55.1%" stop-color="#f1e05a" />
      <stop offset="80%" stop-color="#f1e05a" />
      <stop offset="80.1%" stop-color="#e34c26" />
      <stop offset="93%" stop-color="#e34c26" />
      <stop offset="93.1%" stop-color="#89e051" />
      <stop offset="100%" stop-color="#89e051" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="850" height="180" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1" />

  <!-- GitHub Logo & Title -->
  <g transform="translate(30, 26)">
    <!-- GitHub Octocat Mark -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill="#58a6ff" transform="scale(1.1)"/>
    <text x="35" y="18" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Pushkar Mishra &bull; Engineering Activity</text>
  </g>

  <!-- Live Status Badge -->
  <g transform="translate(680, 26)">
    <rect width="135" height="24" rx="12" fill="#1f2937" stroke="#22c55e" stroke-width="0.8" />
    <circle cx="14" cy="12" r="4" fill="#22c55e" />
    <text x="26" y="16" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Active &amp; Building</text>
  </g>

  <!-- Left Column: Focus Metrics -->
  <g transform="translate(30, 68)">
    <text x="0" y="16" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Primary Stack:</text>
    <text x="120" y="16" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">FastAPI, Python, Asynchronous I/O</text>

    <text x="0" y="42" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">AI &amp; Vision:</text>
    <text x="120" y="42" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">YOLOv8, PyTorch, Computer Vision</text>

    <text x="0" y="68" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Key Systems:</text>
    <text x="120" y="68" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Orbit2Ore (Satellite &amp; Drone AI Suite)</text>
  </g>

  <!-- Right Column: Language Distribution Bar -->
  <g transform="translate(480, 72)">
    <text x="0" y="14" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">LANGUAGE DISTRIBUTION</text>
    
    <!-- Progress Bar -->
    <rect x="0" y="24" width="335" height="10" rx="5" fill="url(#barGrad)" />

    <!-- Legend -->
    <g transform="translate(0, 52)">
      <!-- Python -->
      <circle cx="5" cy="5" r="4" fill="#3572A5" />
      <text x="14" y="9" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Python 55%</text>

      <!-- JavaScript -->
      <circle cx="100" cy="5" r="4" fill="#f1e05a" />
      <text x="109" y="9" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">JavaScript 25%</text>

      <!-- Web/HTML -->
      <circle cx="205" cy="5" r="4" fill="#e34c26" />
      <text x="214" y="9" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Web/UI 15%</text>

      <!-- Shell -->
      <circle cx="285" cy="5" r="4" fill="#89e051" />
      <text x="294" y="9" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Other 5%</text>
    </g>
